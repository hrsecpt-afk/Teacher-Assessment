<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบประเมินผลการปฏิบัติงาน — ศูนย์การศึกษาพิเศษ ประจำจังหวัดปทุมธานี</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<!-- ==================== หน้าเข้าสู่ระบบ ==================== -->
<div class="login-screen" id="login-screen" style="display:none">
  <div class="login-card">
    <div class="logo">
      <img src="logo.png" alt="ตราหน่วยงาน" onerror="this.style.display='none'">
      <h1>ระบบประเมินผลการปฏิบัติงาน</h1>
    </div>
    <div class="sub" id="login-org">ศูนย์การศึกษาพิเศษ ประจำจังหวัดปทุมธานี</div>

    <div class="role-tabs" id="role-tabs">
      <button class="role-tab active" data-role="evaluatee">ผู้รับการประเมิน</button>
      <button class="role-tab" data-role="evaluator">กรรมการประเมิน</button>
      <button class="role-tab" data-role="admin">ผู้ดูแลระบบ</button>
    </div>

    <form id="login-form" autocomplete="on">
      <div id="login-fields"></div>
      <div class="login-err" id="login-err"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:6px">เข้าสู่ระบบ</button>
    </form>

    <div class="small" style="margin-top:16px;color:#8b96a8;line-height:1.7" id="login-hint"></div>
  </div>
</div>

<!-- ==================== ตัวระบบ ==================== -->
<div class="app" id="app" style="display:none">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="logo.png" alt="" onerror="this.style.display='none'">
      <div>
        <div class="t1">ระบบประเมินผลการปฏิบัติงาน</div>
        <div class="t2" id="brand-org">ศูนย์การศึกษาพิเศษ ปทุมธานี</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="who" id="me-name">—</div>
      <div class="role" id="me-role">—</div>
      <div class="sync" id="sync-state"><span class="dot"></span><span class="txt">เก็บข้อมูลในเครื่องนี้</span></div>
      <button class="btn btn-sm" style="width:100%;margin-top:10px" onclick="App.logout()">ออกจากระบบ</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-sm menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <h1 id="page-title">—</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="spacer"></div>
      <div class="sub" id="page-actions"></div>
    </header>
    <div class="content" id="page"></div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>
<div id="modal-host"></div>

<script src="js/config.js"></script>
<script src="js/forms.js"></script>
<script src="js/store.js"></script>
<script src="js/print.js"></script>
<script src="js/app.js"></script>
</body>
</html>
